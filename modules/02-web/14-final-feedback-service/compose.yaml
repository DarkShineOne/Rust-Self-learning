services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - feedback_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../../..
      dockerfile: modules/02-web/14-final-feedback-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: postgres://feedback:feedback@postgres:5432/feedback
      JWT_SECRET: local-development-only-change-me-32-bytes
      JWT_ISSUER: feedback-service
      JWT_AUDIENCE: feedback-api
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT for your self-hosted S3}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      NOTIFICATION_URL: ${NOTIFICATION_URL:?set NOTIFICATION_URL}
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:?set NOTIFICATION_API_KEY}
    ports:
      - "3000:3000"

volumes:
  feedback_pgdata:
