services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - feedback_pgdata:/var/lib/postgresql/data

volumes:
  feedback_pgdata:
